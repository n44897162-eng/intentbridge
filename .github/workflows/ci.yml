name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify-linux:
    name: Linux verify (real Chrome + WASM)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.21.0 --activate
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.89.0'
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - name: Install Xvfb and Chromium dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
      - name: Install Playwright Chromium (extension tests need an unbranded build)
        run: pnpm exec playwright install --with-deps chromium
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      - name: Quality gate
        run: xvfb-run -a node scripts/gate.mjs
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            artifacts/
            sbom/
          if-no-files-found: ignore

  windows-build:
    name: Windows compile (dotnet 8, no runtime tests)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build UIA executor and WPF fixture
        run: |
          dotnet build fixtures/windows-fixture/IntentBridge.Fixture.csproj -c Release
          dotnet build apps/windows-executor/IntentBridge.Executor.csproj -c Release

  android-build:
    name: Android compile (SDK 35 + JNI, no emulator)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.89.0'
          targets: aarch64-linux-android,x86_64-linux-android
      - name: Install NDK and Gradle
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.14206865"
          curl -sSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/gradle
      - name: Build native library and APKs
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          export GRADLE_COMMAND=/opt/gradle/gradle-8.9/bin/gradle
          node scripts/build-platforms.mjs
