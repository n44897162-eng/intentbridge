name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release assets
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.21.0 --activate

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.89.0'
          targets: wasm32-unknown-unknown,aarch64-linux-android,x86_64-linux-android
          components: rustfmt, clippy

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Android SDK/NDK and Gradle
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.14206865"
          curl -sSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/gradle

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build WASM, extension and artifacts
        run: |
          cargo build -p ib-runtime --lib --release --target wasm32-unknown-unknown
          node scripts/copy-wasm.mjs
          pnpm -r --if-present run build
          node scripts/build-platforms.mjs
          node scripts/package.mjs

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/android/*.apk
            artifacts/intentbridge-extension-*.zip
            artifacts/intentbridge-*-source.tar.gz
            artifacts/SHA256SUMS
